name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version erhöhen"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build release
        shell: bash
        run: |
          if [ "${{ inputs.bump }}" = "none" ]; then
            uv run python scripts/create_release.py --no-bump
          else
            uv run python scripts/create_release.py --bump "${{ inputs.bump }}"
          fi

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: inputs.bump != 'none'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git diff --staged --quiet || git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: File Organizer v${{ steps.version.outputs.version }}
          files: Release/FileOrganizer-*.zip
          generate_release_notes: true
          make_latest: true
